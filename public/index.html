<!--
════════════════════════════════════════════════════════════════════
  MÉTODO 3·2·1 · Aplicación de Inteligencia Estratégica
  ────────────────────────────────────────────────────────────────
  Arquitectura modular (cada bloque marcado "MÓDULO" equivale a un
  archivo independiente si se separa el proyecto):

    MÓDULO KB      → js/kb.js          Base de conocimiento (Método 3·2·1)
    MÓDULO STORE   → js/store.js       Estado + persistencia
    MÓDULO AI      → js/ai.js          Motor de IA (estratega senior)
    MÓDULO ICG     → js/icg.js         Cálculo del Índice de Contenido Ganador
    MÓDULO UI      → js/ui.js          Helpers de interfaz
    MÓDULO S1..S10 → js/screens/*.js   Pantallas
    MÓDULO ROUTER  → js/app.js         Navegación e inicio

  Para agregar plataformas nuevas (TikTok Shop, Threads, YouTube,
  Pinterest, LinkedIn) o cambios de algoritmo: pantalla "Método"
  → Módulos de actualización. No se toca el código.
════════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
