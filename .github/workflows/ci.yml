name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Sintaxis de todos los módulos
        run: |
          for f in server.js public/js/*.js public/js/screens/*.js; do
            node --check "$f"
          done
      - name: Pruebas unitarias (ICG, schemas, presupuesto)
        run: npm test
