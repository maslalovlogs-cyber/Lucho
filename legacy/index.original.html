/* ════════════════════════════════════════════════════════════════
   MÓDULO S2 — js/screens/diagnostico.js · PANTALLA 2: Diagnóstico
   La IA analiza la ficha con el método en 3 pasos encadenados:
   1) FODA + dolores/deseos/objeciones + preguntas inteligentes
   2) Buyer persona + mapa de empatía
   3) Niveles, probabilidad de éxito y Matriz de Adaptación
   ════════════════════════════════════════════════════════════════ */
const S_Dx = {
  title: 'Diagnóstico',
  faltantes(c){
    const req = { empresa:'empresa', industria:'industria', objetivos:'objetivos', presupuesto:'presupuesto mensual', precioProm:'precio promedio', ciudad:'ciudad', tipo:'tipo de negocio' };
    return Object.keys(req).filter(k => !c.intake[k]).map(k => req[k]);
  },
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const d = c.diagnostico;
    let html = '<div class="h-page"><div><h2>Diagnóstico</h2><p>Análisis del negocio con las lentes del método: FODA, buyer persona, mapa de empatía, niveles y configuración de la Matriz de Adaptación.</p></div>' +
      '<button class="btn pri" id="bGen">' + (d ? 'Regenerar diagnóstico' : 'Generar diagnóstico') + '</button></div>';

    const falta = this.faltantes(c);
    if (falta.length) html += '<div class="warn"><b>Ficha incompleta:</b> falta ' + falta.join(', ') + '. Puedes generar igual — la IA marcará sus supuestos y hará preguntas inteligentes.</div>';
    html += '<div id="dxProg"></div>';

    if (!d){
      html += '<div class="card"><div class="empty"><div class="art">Dx</div><h4>Aún no hay diagnóstico</h4><p>La IA leerá la ficha completa y la analizará exclusivamente con el Método 3·2·1.</p></div></div>';
    } else {
      if (d.preguntas && d.preguntas.length){
        html += '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Preguntas inteligentes</h3><span class="hint">responderlas afina la estrategia</span></div><div class="card-b">' + UI.ul(d.preguntas) + '</div></div>';
      }
      html += '<div class="grid2" style="margin-bottom:16px"><div class="card"><div class="card-h"><h3>Probabilidad de éxito</h3><span class="hint">a 6 meses, ejecutando el método</span></div><div class="card-b"><div class="gauge">' +
        '<span class="num" style="color:var(--blue)">' + (d.probabilidad||0) + '%</span><p style="font-size:12.5px;color:var(--muted)">' + UI.esc(d.probabilidadNota||'') + '</p></div></div></div>' +
        '<div class="card"><div class="card-h"><h3>Niveles actuales</h3><span class="hint">0–10</span></div><div class="card-b">' +
        UI.meter('Competencia del mercado', d.niveles && d.niveles.competencia) +
        UI.meter('Autoridad', d.niveles && d.niveles.autoridad) +
        UI.meter('Contenido', d.niveles && d.niveles.contenido) +
        UI.meter('Marca', d.niveles && d.niveles.marca) +
        UI.meter('Ventas', d.niveles && d.niveles.ventas) +
        UI.meter('Confianza', d.niveles && d.niveles.confianza) +
        '</div></div></div>';

      if (d.matriz){
        html += '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Matriz de Adaptación</h3><span class="hint">variables que configuran todo el semestre</span></div><div class="card-b"><div class="meta-grid">' +
          '<div class="m"><b>Plataforma primaria</b><span>' + UI.esc(d.matriz.plataformaPrimaria) + '</span></div>' +
          '<div class="m"><b>Secundaria</b><span>' + UI.esc(d.matriz.plataformaSecundaria) + '</span></div>' +
          '<div class="m"><b>CTA principal</b><span>' + UI.esc(d.matriz.ctaPrincipal) + '</span></div>' +
          '<div class="m"><b>Ciclo de venta</b><span>' + UI.esc(d.matriz.cicloVenta) + '</span></div></div>' +
          '<div style="margin-top:12px"><b style="font-size:12px">Los 4 pilares de contenido</b><div style="margin-top:6px">' + UI.chips(d.matriz.pilares, 'blue') + '</div></div>' +
          (d.matriz.particularidades ? '<p style="font-size:12.5px;color:var(--muted);margin-top:10px">' + UI.esc(d.matriz.particularidades) + '</p>' : '') +
          '</div></div>';
      }

      if (d.foda){
        html += '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Análisis FODA</h3></div><div class="card-b"><div class="foda">' +
          '<div class="q"><h5><span class="chip green">F</span>Fortalezas</h5>' + UI.ul(d.foda.fortalezas) + '</div>' +
          '<div class="q"><h5><span class="chip blue">O</span>Oportunidades</h5>' + UI.ul(d.foda.oportunidades) + '</div>' +
          '<div class="q"><h5><span class="chip amber">D</span>Debilidades</h5>' + UI.ul(d.foda.debilidades) + '</div>' +
          '<div class="q"><h5><span class="chip red">A</span>Amenazas</h5>' + UI.ul(d.foda.amenazas) + '</div></div></div></div>';
      }

      html += '<div class="grid3" style="margin-bottom:16px">' +
        '<div class="card"><div class="card-h"><h3>Dolores</h3></div><div class="card-b">' + UI.ul(d.dolores) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>Deseos</h3></div><div class="card-b">' + UI.ul(d.deseos) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>Objeciones</h3></div><div class="card-b">' + UI.ul(d.objeciones) + '</div></div></div>';

      if (d.persona){
        html += '<div class="grid2"><div class="card"><div class="card-h"><h3>Buyer persona</h3></div><div class="card-b">' +
          '<b style="font-size:15px">' + UI.esc(d.persona.nombre||'') + '</b> <span class="chip gray">' + UI.esc(d.persona.edad||'') + '</span>' +
          '<p style="font-size:13px;margin:8px 0">' + UI.esc(d.persona.contexto||'') + '</p><div class="meta-grid">' +
          '<div class="m"><b>Ocupación</b><span>' + UI.esc(d.persona.ocupacion||'') + '</span></div>' +
          '<div class="m"><b>Dolor principal</b><span>' + UI.esc(d.persona.dolorPrincipal||'') + '</span></div>' +
          '<div class="m"><b>Motivación</b><span>' + UI.esc(d.persona.motivacion||'') + '</span></div>' +
          '<div class="m"><b>Dónde vive digitalmente</b><span>' + UI.esc(d.persona.canales||'') + '</span></div></div></div></div>';
        const e = d.empatia || {};
        html += '<div class="card"><div class="card-h"><h3>Mapa de empatía</h3></div><div class="card-b"><div class="meta-grid" style="grid-template-columns:1fr 1fr">' +
          '<div class="m"><b>Piensa y siente</b><span>' + UI.esc(e.piensaSiente||'') + '</span></div>' +
          '<div class="m"><b>Ve</b><span>' + UI.esc(e.ve||'') + '</span></div>' +
          '<div class="m"><b>Oye</b><span>' + UI.esc(e.oye||'') + '</span></div>' +
          '<div class="m"><b>Dice y hace</b><span>' + UI.esc(e.diceHace||'') + '</span></div>' +
          '<div class="m"><b>Esfuerzos (frustraciones)</b><span>' + UI.esc(e.esfuerzos||'') + '</span></div>' +
          '<div class="m"><b>Resultados (lo que quiere lograr)</b><span>' + UI.esc(e.resultados||'') + '</span></div>' +
          '</div></div></div></div>';
      }
    }
    el.innerHTML = html;
    document.getElementById('bGen').onclick = () => this.generar(c);
  },
  async generar(c){
    const prog = document.getElementById('dxProg');
    const btn = document.getElementById('bGen'); btn.disabled = true;
    const falta = this.faltantes(c);
    try{
      prog.innerHTML = UI.thinking('Paso 1/3 · FODA, dolores, deseos y objeciones…');
      const p1 = await AI.json(
        AI.system(['principios','matriz','evitar'], 'Estás haciendo el diagnóstico de onboarding (Semana 0).'),
        AI.clienteCtx(c) + (falta.length ? '\nCampos sin responder: ' + falta.join(', ') + '.' : '') +
        '\nDevuelve JSON: {"foda":{"fortalezas":[3-4 str],"oportunidades":[3-4],"debilidades":[3-4],"amenazas":[3]},"dolores":[4 str cortos del cliente final],"deseos":[4],"objeciones":[4],"preguntas":[2-4 preguntas inteligentes SOLO sobre información faltante o ambigua de la ficha; si nada falta, []]}. Frases de máx 14 palabras.');
      prog.innerHTML = UI.thinking('Paso 2/3 · Buyer persona y mapa de empatía…');
      const p2 = await AI.json(
        AI.system(['principios','matriz'], 'Construyes el buyer persona del onboarding.'),
        AI.clienteCtx(c) + '\nDolores detectados: ' + JSON.stringify(p1.dolores) +
        '\nDevuelve JSON: {"persona":{"nombre":str,"edad":str,"ocupacion":str,"contexto":str máx 30 palabras,"dolorPrincipal":str,"motivacion":str,"canales":str},"empatia":{"piensaSiente":str,"ve":str,"oye":str,"diceHace":str,"esfuerzos":str,"resultados":str}}. Cada campo de empatía máx 15 palabras.');
      prog.innerHTML = UI.thinking('Paso 3/3 · Niveles, probabilidad y Matriz de Adaptación…');
      const p3 = await AI.json(
        AI.system(['principios','matriz','algoritmos'], 'Cierras el diagnóstico configurando la Matriz de Adaptación del método para este negocio.'),
        AI.clienteCtx(c) +
        '\nDevuelve JSON: {"niveles":{"competencia":0-10,"autoridad":0-10,"contenido":0-10,"marca":0-10,"ventas":0-10,"confianza":0-10},"probabilidad":40-95,"probabilidadNota":str máx 22 palabras justificando,"matriz":{"plataformaPrimaria":str,"plataformaSecundaria":str,"pilares":[4 pilares concretos para ESTE negocio],"ctaPrincipal":str,"cicloVenta":str,"particularidades":str máx 25 palabras (regulación, ética, estacionalidad si aplica)}}');
      c.diagnostico = Object.assign({}, p1, p2, p3);
      Store.save(); App.refresh(); UI.toast('Diagnóstico generado con el Método 3·2·1');
    }catch(e){
      prog.innerHTML = '<div class="warn">No se pudo completar el diagnóstico: ' + UI.esc(e.message) + '. Intenta de nuevo.</div>';
      btn.disabled = false;
    }
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S3 — js/screens/estrategia.js · PANTALLA 3: Estrategia
   Plan de 6 meses por etapas. El presupuesto se calcula en código
   (distribución 5/10/15/20/20/30 es regla fija del método); la IA
   personaliza objetivos, cronograma y tareas por etapa.
   ════════════════════════════════════════════════════════════════ */
const S_Estrategia = {
  title: 'Estrategia 6 meses',
  DIST: [5,10,15,20,20,30],
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const tieneDx = !!c.diagnostico;
    let html = '<div class="h-page"><div><h2>Estrategia de 6 meses</h2><p>Roadmap completo del semestre: Reconocimiento (3) → Consideración (2) → Conversión (1), con objetivos, KPI, cronograma, tareas y presupuesto.</p></div>' +
      '<button class="btn pri" id="bGen" ' + (tieneDx ? '' : 'disabled title="Genera primero el diagnóstico"') + '>' + (c.estrategia.e1 ? 'Regenerar estrategia' : 'Generar estrategia') + '</button></div>';
    if (!tieneDx) html += '<div class="note">El método exige diagnóstico antes de estrategia (Semana 0 → configuración de la Matriz). <b>Genera primero el diagnóstico.</b></div>';
    html += '<div id="esProg"></div>';

    // Presupuesto semestral — cálculo determinista del método
    const p = +c.intake.presupuesto || 0;
    if (p > 0){
      const total = p * 6;
      const nivel = p < 300 ? 'A · Local básico' : (p <= 1500 ? 'B · Crecimiento' : 'C · Agresivo');
      html += '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Presupuesto publicitario del semestre</h3><span class="hint">distribución fija del método · nivel ' + nivel + '</span></div>' +
        '<div class="card-b"><table class="tb"><tr><th>Mes</th>' + [1,2,3,4,5,6].map(m => '<th>M' + m + '</th>').join('') + '<th>Total</th></tr>' +
        '<tr><td>% del semestre</td>' + this.DIST.map(x => '<td class="num">' + x + '%</td>').join('') + '<td class="num">100%</td></tr>' +
        '<tr><td>Inversión</td>' + this.DIST.map(x => '<td class="num">' + UI.fmtMoney(total * x / 100) + '</td>').join('') + '<td class="num"><b>' + UI.fmtMoney(total) + '</b></td></tr></table>' +
        '<p style="font-size:12px;color:var(--muted);margin-top:10px">Regla del método: la pauta nunca rescata contenido débil — amplifica piezas con ICG ≥ 1.2 ya validadas orgánicamente.</p></div></div>';
    }

    const et = [
      { k:'e1', n:'3', titulo:'Etapa 1 · Reconocimiento', rango:'Meses 1–3', color:'blue' },
      { k:'e2', n:'2', titulo:'Etapa 2 · Consideración', rango:'Meses 4–5', color:'green' },
      { k:'e3', n:'1', titulo:'Etapa 3 · Conversión', rango:'Mes 6', color:'gold' }
    ];
    et.forEach(e => {
      const d = c.estrategia[e.k];
      html += '<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="chip ' + e.color + '" style="font-family:var(--mono)">' + e.n + '</span><h3>' + e.titulo + '</h3><span class="hint">' + e.rango + '</span></div><div class="card-b">';
      if (!d){ html += '<p style="color:var(--faint);font-size:13px">Pendiente de generar.</p>'; }
      else {
        html += '<p style="font-size:13.5px;margin-bottom:14px"><b>Misión:</b> ' + UI.esc(d.mision||'') + '</p>' +
          '<div class="grid2"><div><b style="font-size:12.5px">Objetivos</b>' + UI.ul(d.objetivos) + '</div>' +
          '<div><b style="font-size:12.5px">KPI de la etapa</b>' + UI.ul(d.kpi) + '</div></div>';
        if (d.cronograma && d.cronograma.length){
          html += '<div class="fs-title">Cronograma</div><table class="tb"><tr><th style="width:120px">Periodo</th><th>Foco</th><th>Acciones clave</th></tr>' +
            d.cronograma.map(r => '<tr><td><b>' + UI.esc(r.periodo) + '</b></td><td>' + UI.esc(r.foco) + '</td><td>' + UI.esc((r.acciones||[]).join(' · ')) + '</td></tr>').join('') + '</table>';
        }
        if (d.tareas && d.tareas.length){
          html += '<div class="fs-title">Tareas del equipo</div>' + UI.ul(d.tareas);
        }
        if (d.pauta) html += '<p style="font-size:12.5px;color:var(--muted);margin-top:12px"><b>Pauta:</b> ' + UI.esc(d.pauta) + '</p>';
      }
      html += '</div></div>';
    });
    el.innerHTML = html;
    const b = document.getElementById('bGen');
    if (b && !b.disabled) b.onclick = () => this.generar(c);
  },
  async generar(c){
    const prog = document.getElementById('esProg');
    document.getElementById('bGen').disabled = true;
    const defs = [
      { k:'e1', kb:['principios','etapa1','ab','operativo'], label:'Etapa 1 · Reconocimiento (meses 1–3)', extra:'Cronograma con 3 filas: "Mes 1 · Exploración", "Mes 2 · Iteración", "Mes 3 · Validación".' },
      { k:'e2', kb:['principios','etapa2','operativo'], label:'Etapa 2 · Consideración (meses 4–5)', extra:'Cronograma con 2 filas: "Mes 4" y "Mes 5" (optimización, influencers según presupuesto, UGC y prueba social).' },
      { k:'e3', kb:['principios','etapa3','operativo'], label:'Etapa 3 · Conversión (mes 6)', extra:'Cronograma con 4 filas: "Semana 1 · Pre-lanzamiento", "Semana 2 · Apertura", "Semana 3 · Prueba social", "Semana 4 · Cierre". Incluye el diseño de oferta recomendado (por defecto bonus stack) adaptado a este negocio.' }
    ];
    try{
      for (const d of defs){
        prog.innerHTML = UI.thinking('Generando ' + d.label + '…');
        c.estrategia[d.k] = await AI.json(
          AI.system(d.kb, 'Diseñas el plan de "' + d.label + '" para este cliente.'),
          AI.clienteCtx(c) + '\n' + d.extra +
          '\nDevuelve JSON: {"mision":str máx 25 palabras,"objetivos":[3 str medibles y específicos de este negocio],"kpi":[3-4 str con metas numéricas del método],"cronograma":[{"periodo":str,"foco":str máx 10 palabras,"acciones":[2-3 str cortos]}],"tareas":[3-4 str operativas],"pauta":str máx 25 palabras sobre cómo usar el presupuesto de la etapa}');
        Store.save();
      }
      App.refresh(); UI.toast('Estrategia de 6 meses lista');
    }catch(e){
      prog.innerHTML = '<div class="warn">Error al generar: ' + UI.esc(e.message) + '. Vuelve a intentar (lo ya generado quedó guardado).</div>';
      document.getElementById('bGen').disabled = false;
    }
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S4 — js/screens/contenido.js · PANTALLA 4: Contenido
   Generador de piezas completas (gancho, guion, CTA, psicología,
   algoritmo, edición, SEO…). Nunca repite ideas: el historial de
   títulos viaja en cada prompt.
   ════════════════════════════════════════════════════════════════ */
const S_Contenido = {
  title: 'Contenido',
  FORMATOS: ['Automático (decide el método)','Reel','Carrusel','Historias (secuencia)','Post','Live','Colaboración','UGC','Serie','Storytelling','Ranking','POV','Errores comunes','Antes y después','Caso real','Mini documental','Mitos y verdades','Comparativa','FAQ','Opinión impopular','Cómo lo hacemos','Un día en','Tendencia adaptada'],
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const pilares = (c.diagnostico && c.diagnostico.matriz && c.diagnostico.matriz.pilares) || ['Educación / Utilidad','Entretenimiento / Identidad','Conexión / Humano','Prueba / Producto'];
    let html = '<div class="h-page"><div><h2>Contenido</h2><p>Cada pieza sale con gancho, guion completo, CTA, objetivo psicológico, objetivo de algoritmo, edición, SEO y su ICG esperado — lista para programar en el calendario.</p></div></div>';
    if (!c.diagnostico) html += '<div class="warn">Sin diagnóstico, la IA no conoce los pilares ni la plataforma primaria. <b>Recomendado: genera el diagnóstico primero.</b></div>';

    html += '<div class="card" style="margin-bottom:18px"><div class="card-b"><div class="fgrid" style="grid-template-columns:1.2fr 1.2fr 1fr .7fr auto;align-items:end">' +
      '<div class="field"><label>Pilar</label><select id="gPilar"><option>Automático (mix de la etapa)</option>' + pilares.map(p => '<option>' + UI.esc(p) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Formato</label><select id="gFmt">' + this.FORMATOS.map(f => '<option>' + UI.esc(f) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Plataforma</label><select id="gPlat"><option>La primaria del cliente</option><option>Instagram</option><option>TikTok</option><option>Facebook</option></select></div>' +
      '<div class="field"><label>Piezas</label><select id="gN"><option>2</option><option>3</option></select></div>' +
      '<div class="field"><button class="btn pri" id="bGenC" style="width:100%">Generar ideas</button></div>' +
      '</div><div id="cProg"></div>' +
      '<p style="font-size:11.5px;color:var(--faint)">El generador respeta el mix de la etapa actual (mes ' + c.mes + ' → Etapa ' + Store.etapaDe(c.mes) + '), la biblioteca de formatos del método y las prácticas prohibidas. No repite ideas ya generadas (' + c.historial.length + ' en el historial).</p>' +
      '</div></div>';

    if (!c.contenidos.length){
      html += '<div class="card"><div class="empty"><div class="art">✦</div><h4>Biblioteca vacía</h4><p>Genera tu primer lote de contenido fundamentado en el Método 3·2·1.</p></div></div>';
    } else {
      html += c.contenidos.slice().reverse().map(it => this.cardPieza(it)).join('');
    }
    el.innerHTML = html;
    document.getElementById('bGenC').onclick = () => this.generar(c);
    el.querySelectorAll('[data-prog]').forEach(b => b.onclick = () => this.programar(c, b.dataset.prog));
    el.querySelectorAll('[data-delc]').forEach(b => b.onclick = () => {
      c.contenidos = c.contenidos.filter(x => x.id !== b.dataset.delc); Store.save(); App.refresh();
    });
  },
  cardPieza(it){
    const m = (k,v) => v ? '<div class="m"><b>' + k + '</b><span>' + UI.esc(v) + '</span></div>' : '';
    return '<details class="acc"><summary><span class="chip blue">' + UI.esc(it.formato) + '</span><span class="chip line">' + UI.esc(it.pilar||'') + '</span> ' + UI.esc(it.titulo) +
      '<span class="car">▶</span></summary><div class="acc-b">' +
      '<p style="margin:6px 0 10px"><b>Gancho (0–3 s):</b> ' + UI.esc(it.gancho) + '</p>' +
      '<div class="script">' + UI.esc(it.guion) + '</div>' +
      '<p style="margin:10px 0"><b>CTA:</b> ' + UI.esc(it.cta) + '</p>' +
      '<div class="meta-grid">' +
      m('Objetivo psicológico', it.objPsico) + m('Objetivo del algoritmo', it.objAlgoritmo) +
      m('Duración', it.duracion) + m('Edición', it.edicion) + m('Plano / grabación', it.plano) +
      m('Miniatura / portada', it.miniatura) + m('Keyword SEO', it.keyword) + m('Música', it.musica) +
      m('Hashtags', (it.hashtags||[]).join(' ')) + m('ICG esperado', it.icgEsperado) +
      m('Plataforma', it.plataforma) + m('Etapa', it.etapa) +
      '</div><div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn sm pri" data-prog="' + it.id + '">Programar en calendario</button>' +
      '<button class="btn sm ghost danger" data-delc="' + it.id + '">Eliminar</button></div></div></details>';
  },
  async generar(c){
    const prog = document.getElementById('cProg');
    const btn = document.getElementById('bGenC'); btn.disabled = true;
    const pilar = document.getElementById('gPilar').value, fmt = document.getElementById('gFmt').value,
          plat = document.getElementById('gPlat').value, n = +document.getElementById('gN').value;
    const nuevas = [];
    try{
      for (let i = 1; i <= n; i++){
        prog.innerHTML = UI.thinking('Diseñando pieza ' + i + ' de ' + n + ' con las estructuras del método…');
        const it = await AI.json(
          AI.system(['principios','algoritmos','formatos','evitar','operativo'], 'Diseñas UNA pieza de contenido lista para producir.'),
          AI.clienteCtx(c) +
          '\nPedido: 1 pieza. Pilar: ' + pilar + '. Formato: ' + fmt + '. Plataforma: ' + plat + '.' +
          ((c.historial.length || nuevas.length) ? '\nNO repitas ninguna de estas ideas ya usadas: ' + JSON.stringify(c.historial.slice(-40).concat(nuevas)) : '') +
          (c.banco.filter(b => b.icg >= 1.2).length ? '\nPrioriza variaciones de las estructuras ganadoras del Banco (Regla de 3).' : '') +
          '\nDevuelve JSON (UN solo objeto): {"titulo":str,"formato":str,"pilar":str,"plataforma":str,"etapa":"Etapa 1|2|3","gancho":str literal para decir/mostrar en 0-3s con la keyword,"guion":str guion completo con marcas de tiempo y qué se ve/dice (5-8 líneas, usa \\n),"cta":str un solo CTA del método,"objPsico":str máx 8 palabras,"objAlgoritmo":str señal que fabrica máx 8 palabras,"duracion":str,"edicion":str máx 12 palabras,"plano":str máx 10 palabras,"miniatura":str máx 12 palabras,"hashtags":[3-5 con #],"keyword":str,"musica":str máx 8 palabras,"icgEsperado":str p.ej "1.2-1.4 (gancho de aversión a la pérdida)"}. Guion específico de ESTE negocio con sus productos y ciudad reales.');
        it.id = Store.uid(); it.creado = new Date().toISOString();
        c.contenidos.push(it); c.historial.push(it.titulo); nuevas.push(it.titulo);
        Store.save();
      }
      App.refresh(); UI.toast(n + ' piezas nuevas en la biblioteca');
    }catch(e){
      App.refresh();
      UI.toast('Error al generar' + (nuevas.length ? ' (se guardaron ' + nuevas.length + ' piezas)' : '') + ': ' + e.message);
    }
  },
  programar(c, id){
    const it = c.contenidos.find(x => x.id === id); if (!it) return;
    const hoy = new Date().toISOString().slice(0,10);
    UI.modal('Programar pieza', '<div class="field"><label>Fecha de publicación</label><input type="date" id="pFecha" value="' + hoy + '"></div>' +
      '<button class="btn pri" id="pOk" style="width:100%">Agregar al calendario</button>', () => {
      document.getElementById('pOk').onclick = () => {
        c.calendario.push({ id: Store.uid(), contenidoId: it.id, titulo: it.titulo, formato: it.formato, pilar: it.pilar, fecha: document.getElementById('pFecha').value, publicado: false });
        Store.save(); UI.closeModal(); UI.toast('Programado'); App.go('cal');
      };
    });
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S5 — js/screens/calendario.js · PANTALLA 5: Calendario
   Vista mensual y semanal · arrastrar y soltar · duplicar ·
   marcar como publicado.
   ════════════════════════════════════════════════════════════════ */
const S_Cal = {
  title: 'Calendario',
  vista: 'mes',
  cursor: new Date(),
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const cur = this.cursor;
    let html = '<div class="h-page"><div><h2>Calendario editorial</h2><p>Arrastra las piezas entre días para moverlas. El método recomienda 4–5 piezas de feed por semana en días alternados.</p></div>' +
      '<div style="display:flex;gap:8px"><div class="seg"><button id="vMes" class="' + (this.vista==='mes'?'on':'') + '">Mes</button><button id="vSem" class="' + (this.vista==='sem'?'on':'') + '">Semana</button></div>' +
      '<button class="btn" id="bPlan" title="La IA programa la semana siguiente con la plantilla del método">Planificar semana con IA</button></div></div>' +
      '<div id="calProg"></div>' +
      '<div class="cal-head"><button class="btn sm" id="cPrev">←</button><h3 id="cTitle"></h3><button class="btn sm" id="cNext">→</button><button class="btn sm ghost" id="cHoy">Hoy</button></div>' +
      '<div id="calBody"></div>';
    el.innerHTML = html;
    document.getElementById('vMes').onclick = () => { this.vista='mes'; App.refresh(); };
    document.getElementById('vSem').onclick = () => { this.vista='sem'; App.refresh(); };
    document.getElementById('cPrev').onclick = () => { this.mueve(-1); };
    document.getElementById('cNext').onclick = () => { this.mueve(1); };
    document.getElementById('cHoy').onclick = () => { this.cursor = new Date(); App.refresh(); };
    document.getElementById('bPlan').onclick = () => this.planSemana(c);
    this.pinta(c);
  },
  mueve(dir){
    const d = this.cursor;
    if (this.vista === 'mes') this.cursor = new Date(d.getFullYear(), d.getMonth() + dir, 1);
    else this.cursor = new Date(d.getFullYear(), d.getMonth(), d.getDate() + dir * 7);
    App.refresh();
  },
  iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); },
  itemHTML(it){
    return '<div class="cal-it' + (it.publicado ? ' pub' : '') + '" draggable="true" data-cit="' + it.id + '">' +
      '<span class="f">' + UI.esc(it.formato||'') + '</span>' + UI.esc(it.titulo) +
      '<div class="acts"><button data-pub="' + it.id + '" title="Marcar publicado">✓</button><button data-mov="' + it.id + '" title="Mover a otra fecha">⇄</button><button data-dup="' + it.id + '" title="Duplicar">⧉</button><button data-del="' + it.id + '" title="Quitar">✕</button></div></div>';
  },
  pinta(c){
    const body = document.getElementById('calBody');
    const hoy = this.iso(new Date());
    const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    if (this.vista === 'mes'){
      const y = this.cursor.getFullYear(), m = this.cursor.getMonth();
      document.getElementById('cTitle').textContent = this.cursor.toLocaleDateString('es-MX', { month:'long', year:'numeric' }).replace(/^./, s => s.toUpperCase());
      const first = new Date(y, m, 1);
      const start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
      let g = '<div class="cal-grid">' + DOW.map(d => '<div class="cal-dow">' + d + '</div>').join('');
      for (let i = 0; i < 42; i++){
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const k = this.iso(d);
        const its = c.calendario.filter(x => x.fecha === k);
        g += '<div class="cal-day' + (d.getMonth() !== m ? ' out' : '') + (k === hoy ? ' today' : '') + '" data-day="' + k + '"><span class="dnum">' + d.getDate() + '</span>' +
          its.map(it => this.itemHTML(it)).join('') + '</div>';
      }
      body.innerHTML = g + '</div>';
    } else {
      const d0 = new Date(this.cursor);
      d0.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
      const d6 = new Date(d0); d6.setDate(d0.getDate() + 6);
      document.getElementById('cTitle').textContent = 'Semana del ' + UI.fecha(this.iso(d0)) + ' al ' + UI.fecha(this.iso(d6));
      let g = '<div class="week-grid">';
      for (let i = 0; i < 7; i++){
        const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + i);
        const k = this.iso(d);
        g += '<div class="week-col' + (k === hoy ? ' today' : '') + '" data-day="' + k + '"><h5>' + DOW[i] + ' ' + d.getDate() + '</h5>' +
          c.calendario.filter(x => x.fecha === k).map(it => this.itemHTML(it)).join('') + '</div>';
      }
      body.innerHTML = g + '</div>';
    }
    this.wire(c, body);
  },
  wire(c, body){
    body.querySelectorAll('[data-cit]').forEach(elc => {
      elc.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', elc.dataset.cit); });
    });
    body.querySelectorAll('[data-day]').forEach(day => {
      day.addEventListener('dragover', e => { e.preventDefault(); day.classList.add('over'); });
      day.addEventListener('dragleave', () => day.classList.remove('over'));
      day.addEventListener('drop', e => {
        e.preventDefault(); day.classList.remove('over');
        const it = c.calendario.find(x => x.id === e.dataTransfer.getData('text/plain'));
        if (it){ it.fecha = day.dataset.day; Store.save(); this.pinta(c); }
      });
    });
    body.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => {
      const it = c.calendario.find(x => x.id === b.dataset.pub);
      it.publicado = !it.publicado; Store.save(); this.pinta(c);
      if (it.publicado) UI.toast('Publicado ✓ — registra sus métricas en el Banco a las 72 h y 7 días');
    });
    body.querySelectorAll('[data-mov]').forEach(b => b.onclick = () => {
      const it = c.calendario.find(x => x.id === b.dataset.mov);
      UI.modal('Mover pieza', '<div class="field"><label>Nueva fecha</label><input type="date" id="mvF" value="' + it.fecha + '"></div>' +
        '<button class="btn pri" id="mvOk" style="width:100%">Mover</button>', () => {
        document.getElementById('mvOk').onclick = () => {
          it.fecha = document.getElementById('mvF').value || it.fecha;
          Store.save(); UI.closeModal(); S_Cal.pinta(c);
        };
      });
    });
    body.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => {
      const it = c.calendario.find(x => x.id === b.dataset.dup);
      c.calendario.push(Object.assign({}, it, { id: Store.uid(), publicado:false }));
      Store.save(); this.pinta(c);
    });
    body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      c.calendario = c.calendario.filter(x => x.id !== b.dataset.del); Store.save(); this.pinta(c);
    });
  },
  async planSemana(c){
    if (!c.contenidos.length){ UI.toast('Genera contenido primero: el calendario programa piezas de la biblioteca'); return; }
    const prog = document.getElementById('calProg');
    prog.innerHTML = UI.thinking('Asignando la semana con la plantilla semanal del método…');
    try{
      const pend = c.contenidos.filter(it => !c.calendario.some(k => k.contenidoId === it.id)).slice(0, 14);
      if (!pend.length){ prog.innerHTML = ''; UI.toast('Todas las piezas de la biblioteca ya están programadas'); return; }
      const d0 = new Date(); d0.setDate(d0.getDate() + ((8 - d0.getDay()) % 7 || 7)); // próximo lunes
      const res = await AI.json(
        AI.system(['operativo','principios'], 'Programas la semana siguiendo el calendario semanal tipo del método (lunes educativo, miércoles identidad, jueves serie/carrusel, viernes storytelling/prueba social, sábado comunidad).'),
        'Etapa actual: Etapa ' + Store.etapaDe(c.mes) + '. Piezas disponibles: ' + JSON.stringify(pend.map(p => ({ id:p.id, titulo:p.titulo, formato:p.formato, pilar:p.pilar }))) +
        '\nElige 4-5 piezas y asígnales día (0=lunes … 6=domingo) según la plantilla. Devuelve JSON: [{"id":str,"dia":0-6}]');
      (Array.isArray(res) ? res : []).forEach(a => {
        const it = pend.find(p => p.id === a.id); if (!it) return;
        const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + (+a.dia || 0));
        c.calendario.push({ id: Store.uid(), contenidoId: it.id, titulo: it.titulo, formato: it.formato, pilar: it.pilar, fecha: this.iso(d), publicado:false });
      });
      Store.save(); this.cursor = d0; prog.innerHTML = ''; this.pinta(c); UI.toast('Semana planificada con la plantilla del método');
    }catch(e){ prog.innerHTML = '<div class="warn">Error: ' + UI.esc(e.message) + '</div>'; }
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S6 — js/screens/banco.js · PANTALLA 6: Banco de Ganadores
   Registro de piezas publicadas → cálculo automático del ICG
   (medianas móviles) → clasificación → replicar con IA (Regla de 3).
   ════════════════════════════════════════════════════════════════ */
const S_Banco = {
  title: 'Banco de Ganadores',
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const modoVenta = Store.etapaDe(c.mes) === 3;
    const ganadores = c.banco.filter(b => b.icg >= 1.2);
    const prom = c.banco.length ? (c.banco.reduce((s,b) => s + b.icg, 0) / c.banco.length) : 0;
    let html = '<div class="h-page"><div><h2>Banco de Contenido Ganador</h2><p>Registra cada pieza a las 72 h y a los 7 días. El ICG se calcula contra la mediana móvil de tus últimas 15 piezas — la decisión es del dato, no del gusto.' +
      (modoVenta ? ' <b>Mes 6: ICG en modo venta</b> (componente de conversión con peso 0.30).' : '') + '</p></div>' +
      '<button class="btn pri" id="bReg">+ Registrar pieza</button></div>';

    html += '<div class="grid4" style="margin-bottom:18px">' +
      '<div class="card kpi"><div class="lbl">Piezas registradas</div><div class="val">' + c.banco.length + '</div></div>' +
      '<div class="card kpi"><div class="lbl">ICG promedio</div><div class="val" style="color:' + (prom >= 1 ? 'var(--green)' : 'var(--text)') + '">' + (prom ? prom.toFixed(2) : '—') + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Ganadoras (≥ 1.2)</div><div class="val">' + ganadores.length + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Estructuras a certificar</div><div class="val">' + this.estructuras(c).filter(e => e.n >= 3 && e.ok).length + '</div><div class="sub">Regla de 3: tres piezas ≥ 1.3</div></div></div>';

    if (c.banco.length < 5) html += '<div class="note">Con menos de 5 piezas registradas las medianas aún son inestables; el método pide un mes de datos antes de podar nada.</div>';
    html += '<div id="bProg"></div>';

    if (!c.banco.length){
      html += '<div class="card"><div class="empty"><div class="art">ICG</div><h4>El banco está vacío</h4><p>Cuando publiques una pieza del calendario, registra aquí sus métricas y el sistema calculará su ICG y la clasificará automáticamente.</p></div></div>';
    } else {
      html += '<div class="card"><div class="card-h"><h3>Registro y clasificación</h3><span class="hint">ordenado por ICG</span></div><div class="card-b" style="padding:0"><table class="tb"><tr><th>Pieza</th><th>Formato · Pilar</th><th>ICG</th><th>Clase</th><th>Acción del método</th><th></th></tr>' +
        c.banco.slice().sort((a,b) => b.icg - a.icg).map(b => {
          const cl = ICG.clase(b.icg);
          return '<tr><td><b>' + UI.esc(b.titulo) + '</b><div style="font-size:11px;color:var(--faint)">' + UI.esc(b.estructura||'') + '</div></td>' +
            '<td style="font-size:12px;color:var(--muted)">' + UI.esc(b.formato) + ' · ' + UI.esc(b.pilar||'—') + '</td>' +
            '<td><span class="icg-hero" style="font-size:17px">' + b.icg.toFixed(2) + '</span></td>' +
            '<td><span class="chip ' + cl.c + '">' + cl.t + '</span></td>' +
            '<td style="font-size:12px;color:var(--muted)">' + cl.accion + '</td>' +
            '<td style="white-space:nowrap">' + (b.icg >= 1.2 ? '<button class="btn sm" data-rep="' + b.id + '">Replicar ×3</button> ' : '') +
            '<button class="btn sm ghost danger" data-delb="' + b.id + '">✕</button></td></tr>';
        }).join('') + '</table></div></div>';

      const est = this.estructuras(c).filter(e => e.n >= 2);
      if (est.length){
        html += '<div class="card" style="margin-top:16px"><div class="card-h"><h3>Estructuras (Regla de 3)</h3><span class="hint">una estructura se certifica con 3 piezas ≥ 1.3</span></div><div class="card-b" style="padding:0"><table class="tb"><tr><th>Estructura</th><th>Piezas</th><th>ICG medio</th><th>Estado</th></tr>' +
          est.map(e => '<tr><td><b>' + UI.esc(e.k) + '</b></td><td class="num">' + e.n + '</td><td class="num">' + e.prom.toFixed(2) + '</td><td>' +
            (e.n >= 3 && e.ok ? '<span class="chip gold">Certificada ✓</span>' : (e.ok ? '<span class="chip green">Promete · faltan ' + (3 - e.n) + ' réplicas</span>' : '<span class="chip gray">En observación</span>')) + '</td></tr>').join('') + '</table></div></div>';
      }
    }
    el.innerHTML = html;
    document.getElementById('bReg').onclick = () => this.formulario(c);
    el.querySelectorAll('[data-delb]').forEach(b => b.onclick = () => {
      c.banco = c.banco.filter(x => x.id !== b.dataset.delb);
      this.recalcular(c); Store.save(); App.refresh();
    });
    el.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => this.replicar(c, b.dataset.rep));
  },
  estructuras(c){
    const map = {};
    c.banco.forEach(b => {
      const k = b.estructura || (b.formato + ' · ' + (b.pilar || ''));
      (map[k] = map[k] || []).push(b.icg);
    });
    return Object.keys(map).map(k => {
      const v = map[k];
      return { k, n: v.length, prom: v.reduce((s,x) => s+x, 0) / v.length, ok: v.filter(x => x >= 1.3).length >= Math.min(3, v.length) && v.every(x => x >= 1.15) };
    }).sort((a,b) => b.prom - a.prom);
  },
  recalcular(c){
    const modoVenta = Store.etapaDe(c.mes) === 3;
    c.banco.forEach(b => { b.icg = ICG.calc(c.banco, b, modoVenta && b.metricas.conversiones > 0); });
  },
  formulario(c){
    const publicadas = c.calendario.filter(k => k.publicado && !c.banco.some(b => b.calId === k.id));
    const num = (id, lbl, hint) => '<div class="field"><label>' + lbl + (hint ? '<small>' + hint + '</small>' : '') + '</label><input type="number" id="' + id + '" min="0" step="any" value="0"></div>';
    UI.modal('Registrar pieza publicada',
      (publicadas.length ? '<div class="field"><label>Pieza del calendario<small>o escribe una libre abajo</small></label><select id="rCal"><option value="">— libre —</option>' +
        publicadas.map(p => '<option value="' + p.id + '">' + UI.esc(p.titulo) + '</option>').join('') + '</select></div>' : '') +
      '<div class="field"><label>Título</label><input id="rTit" placeholder="nombre de la pieza"></div>' +
      '<div class="fgrid c2">' +
      '<div class="field"><label>Formato</label><select id="rFmt"><option>Reel</option><option>Carrusel</option><option>Historia</option><option>Post</option><option>Live</option><option>Anuncio</option></select></div>' +
      '<div class="field"><label>Pilar</label><input id="rPil" placeholder="p. ej. Educación"></div></div>' +
      '<div class="field"><label>Estructura<small>gancho + desarrollo replicable; agrupa piezas para la Regla de 3</small></label><input id="rEst" placeholder="p. ej. &quot;5 formas de usar X&quot;"></div>' +
      '<div class="fs-title">Métricas a 7 días</div><div class="fgrid">' +
      num('rAl','Alcance') + num('rRet','Retención %','promedio del video') + num('rCom','Compartidos') +
      num('rGua','Guardados') + num('rVis','Visitas a perfil') + num('rCli','Clics') +
      num('rDm','DMs iniciados') + num('rConv','Conversiones','ventas/leads atribuidos') + '</div>' +
      '<button class="btn pri" id="rOk" style="width:100%">Calcular ICG y guardar</button>',
      () => {
        const sel = document.getElementById('rCal');
        if (sel) sel.onchange = () => {
          const p = publicadas.find(x => x.id === sel.value);
          if (p){ document.getElementById('rTit').value = p.titulo; document.getElementById('rPil').value = p.pilar || ''; }
        };
        document.getElementById('rOk').onclick = () => {
          const g = id => +document.getElementById(id).value || 0;
          const pieza = { id: Store.uid(), calId: sel ? sel.value : '', fecha: new Date().toISOString().slice(0,10),
            titulo: document.getElementById('rTit').value || 'Pieza sin título',
            formato: document.getElementById('rFmt').value, pilar: document.getElementById('rPil').value,
            estructura: document.getElementById('rEst').value,
            metricas: { alcance:g('rAl'), retencion:g('rRet'), compartidos:g('rCom'), guardados:g('rGua'), visitas:g('rVis'), clics:g('rCli'), dms:g('rDm'), conversiones:g('rConv') } };
          c.banco.push(pieza);
          this.recalcular(c); Store.save(); UI.closeModal(); App.refresh();
          const cl = ICG.clase(pieza.icg);
          UI.toast('ICG ' + pieza.icg.toFixed(2) + ' · ' + cl.t);
        };
      });
  },
  async replicar(c, id){
    const b = c.banco.find(x => x.id === id); if (!b) return;
    const prog = document.getElementById('bProg');
    const nuevas = [];
    try{
      for (let i = 1; i <= 3; i++){
        prog.innerHTML = UI.thinking('Regla de 3 · réplica ' + i + ' de 3 de la estructura ganadora…');
        const it = await AI.json(
          AI.system(['principios','icg','formatos','algoritmos'], 'Aplicas la Regla de 3: replicas UNA vez una estructura ganadora con un tema distinto, manteniendo gancho y desarrollo.'),
          AI.clienteCtx(c) + '\nEstructura ganadora: ' + JSON.stringify({ titulo:b.titulo, formato:b.formato, pilar:b.pilar, estructura:b.estructura, icg:b.icg }) +
          '\nNo repitas: ' + JSON.stringify(c.historial.slice(-30).concat(nuevas)) +
          '\nDevuelve JSON (UN solo objeto): {"titulo":str,"formato":str,"pilar":str,"plataforma":str,"etapa":str,"gancho":str,"guion":str 4-6 líneas con \\n,"cta":str,"objPsico":str,"objAlgoritmo":str,"duracion":str,"edicion":str,"plano":str,"miniatura":str,"hashtags":[3-5],"keyword":str,"musica":str,"icgEsperado":str}');
        it.id = Store.uid(); it.creado = new Date().toISOString();
        c.contenidos.push(it); c.historial.push(it.titulo); nuevas.push(it.titulo);
        Store.save();
      }
      prog.innerHTML = ''; UI.toast('3 réplicas listas en Contenido'); App.go('con');
    }catch(e){
      prog.innerHTML = '<div class="warn">Error: ' + UI.esc(e.message) + (nuevas.length ? ' · Se guardaron ' + nuevas.length + ' réplica(s) en Contenido.' : '') + '</div>';
    }
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S7 — js/screens/publicidad.js · PANTALLA 7: Publicidad
   ════════════════════════════════════════════════════════════════ */
const S_Ads = {
  title: 'Publicidad',
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const p = +c.intake.presupuesto || 0;
    const nivel = p ? (p < 300 ? 'A · Local básico' : (p <= 1500 ? 'B · Crecimiento' : 'C · Agresivo')) : null;
    const mesPct = [5,10,15,20,20,30][c.mes - 1];
    const ganadores = c.banco.filter(b => b.icg >= 1.2);
    let html = '<div class="h-page"><div><h2>Publicidad</h2><p>La pauta amplifica lo validado: solo corren creativos con ICG ≥ 1.2 o derivados directos. Si un anuncio muere, se vuelve al Banco, no al brainstorming.</p></div>' +
      '<button class="btn pri" id="bCamp">Diseñar campaña del mes</button></div>';

    html += '<div class="grid3" style="margin-bottom:18px">' +
      '<div class="card kpi"><div class="lbl">Nivel de presupuesto</div><div class="val" style="font-size:19px">' + (nivel || 'Sin definir') + '</div><div class="sub">' + (p ? UI.fmtMoney(p) + ' / mes' : 'captura el presupuesto en la ficha') + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Este mes (M' + c.mes + ' → ' + mesPct + '% del semestre)</div><div class="val">' + (p ? UI.fmtMoney(p * 6 * mesPct / 100) : '—') + '</div><div class="sub">distribución fija 5/10/15/20/20/30</div></div>' +
      '<div class="card kpi"><div class="lbl">Creativos elegibles (ICG ≥ 1.2)</div><div class="val">' + ganadores.length + '</div><div class="sub">' + (ganadores.length ? 'listos para pauta' : 'aún sin validar — el orgánico investiga primero') + '</div></div></div>';

    html += '<div id="adProg"></div>';
    if (!c.campanas.length){
      html += '<div class="card"><div class="empty"><div class="art">Ads</div><h4>Sin campañas diseñadas</h4><p>El estratega arma la campaña del mes según tu etapa, nivel de presupuesto y creativos ganadores: objetivos, audiencias, remarketing por temperatura, creativos y KPI.</p></div></div>';
    } else {
      c.campanas.slice().reverse().forEach(k => {
        html += '<details class="acc" open><summary><span class="chip blue">Mes ' + k.mes + '</span> ' + UI.esc(k.nombre) + '<span class="car">▶</span></summary><div class="acc-b">' +
          '<p style="margin-bottom:10px"><b>Objetivo:</b> ' + UI.esc(k.objetivo) + ' · <b>Presupuesto:</b> ' + UI.esc(k.presupuesto) + '</p>';
        if (k.campanas && k.campanas.length){
          html += '<table class="tb"><tr><th>Campaña</th><th>Objetivo de plataforma</th><th>Audiencia</th><th>% Ppto</th><th>Creativo</th><th>KPI meta</th></tr>' +
            k.campanas.map(a => '<tr><td><b>' + UI.esc(a.nombre) + '</b></td><td>' + UI.esc(a.objetivoPlataforma) + '</td><td style="font-size:12px">' + UI.esc(a.audiencia) + '</td><td class="num">' + UI.esc(a.pct) + '</td><td style="font-size:12px">' + UI.esc(a.creativo) + '</td><td style="font-size:12px">' + UI.esc(a.kpi) + '</td></tr>').join('') + '</table>';
        }
        if (k.remarketing) html += '<p style="font-size:12.5px;margin-top:10px"><b>Remarketing:</b> ' + UI.esc(k.remarketing) + '</p>';
        if (k.reglas) html += '<p style="font-size:12.5px;color:var(--muted);margin-top:6px"><b>Reglas de operación:</b> ' + UI.esc(k.reglas) + '</p>';
        html += '<button class="btn sm ghost danger" data-delk="' + k.id + '" style="margin-top:10px">Eliminar</button></div></details>';
      });
    }
    el.innerHTML = html;
    document.getElementById('bCamp').onclick = () => this.generar(c);
    el.querySelectorAll('[data-delk]').forEach(b => b.onclick = () => {
      c.campanas = c.campanas.filter(x => x.id !== b.dataset.delk); Store.save(); App.refresh();
    });
  },
  async generar(c){
    const prog = document.getElementById('adProg');
    prog.innerHTML = UI.thinking('Diseñando la campaña del mes ' + c.mes + ' según etapa y nivel de presupuesto…');
    try{
      const ganadores = c.banco.filter(b => b.icg >= 1.2).map(b => b.titulo + ' (ICG ' + b.icg.toFixed(2) + ')');
      const res = await AI.json(
        AI.system(['principios','etapa' + Store.etapaDe(c.mes), 'operativo'], 'Eres el media buyer del método. Diseñas la estructura publicitaria del mes actual.'),
        AI.clienteCtx(c) + '\nMes del programa: ' + c.mes + '. Creativos ganadores disponibles: ' + (ganadores.length ? JSON.stringify(ganadores) : 'ninguno aún (respeta el Principio 1: sin ICG ≥ 1.2 no hay prospección con presupuesto significativo)') +
        '\nDevuelve JSON: {"nombre":str nombre de la campaña del mes,"objetivo":str máx 15 palabras,"presupuesto":str cómo se reparte el monto del mes,"campanas":[2-4 objetos {"nombre":str,"objetivoPlataforma":str p.ej. interacción/video views/conversiones,"audiencia":str específica,"pct":str "40%","creativo":str qué pieza o derivado,"kpi":str meta numérica}],"remarketing":str máx 30 palabras públicos por temperatura y secuencia,"reglas":str máx 25 palabras (frecuencia, rotación, cuándo apagar)}');
      res.id = Store.uid(); res.mes = c.mes;
      c.campanas.push(res); Store.save(); App.refresh(); UI.toast('Campaña del mes diseñada');
    }catch(e){ prog.innerHTML = '<div class="warn">Error: ' + UI.esc(e.message) + '</div>'; }
  }
};

    try{
      const res = await AI.json(
        AI.system(['etapa3','principios'], 'Diseñas automatizaciones de conversión con los guiones y reglas del método (speed-to-lead <5 min, 1 pregunta calificadora, cadencia 24-72-7, cierre asumido con 2 opciones).'),
        AI.clienteCtx(c) + '\nCanal: ' + canal + '. Objetivo: ' + obj + '. Palabra clave: ' + (kw || 'proponla tú') + '.' +
        '\nDevuelve JSON: {"nombre":str,"canal":str corto,"pasos":[4-6 objetos {"paso":str qué ocurre máx 10 palabras,"mensaje":str texto LITERAL del mensaje con el tono del negocio (usa [Nombre] como variable),"nota":str opcional máx 12 palabras}],"cadencia":str máx 30 palabras qué se envía a las 24h, 72h y día 7}');
      res.id = Store.uid();
      c.autos.push(res); Store.save(); App.refresh(); UI.toast('Secuencia lista');

};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S9 — js/screens/dashboard.js · PANTALLA 9: Dashboard
   KPI semanales, ROAS/CPA/CPL, benchmarks del método, gráficas SVG
   y alertas inteligentes (reglas de diagnóstico por síntoma).
   ════════════════════════════════════════════════════════════════ */
const S_Dash = {
  title: 'Dashboard',
  render(el){
    const c = Store.client();
    if (!c){ el.innerHTML = App.sinCliente(); return; }
    const M = c.metricas;
    const last = M[M.length - 1] || {};
    const prev = M[M.length - 2] || {};
    const roas = last.gasto > 0 ? (last.ingresos || 0) / last.gasto : null;
    const cpa = last.conversiones > 0 ? (last.gasto || 0) / last.conversiones : null;
    const cpl = last.dms > 0 ? (last.gasto || 0) / last.dms : null;
    const icgProm = c.banco.length ? c.banco.reduce((s,b) => s + b.icg, 0) / c.banco.length : null;
    const delta = (a,b) => (a != null && b != null && b !== 0) ? Math.round((a - b) / b * 100) : null;

    let html = '<div class="h-page"><div><h2>Dashboard</h2><p>Ritual de los viernes: registrar métricas, calcular ICG, clasificar, decidir réplicas. La disciplina de este ritual es la diferencia entre una agencia que opina y una que sabe.</p></div>' +
      '<div style="display:flex;gap:8px"><button class="btn" id="bSem">+ Registrar semana</button><button class="btn pri" id="bAn" ' + (M.length ? '' : 'disabled') + '>Análisis del estratega</button></div></div>';

    const kpi = (lbl, val, sub, d) => '<div class="card kpi"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div><div class="sub">' +
      (d != null ? '<span style="color:' + (d >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (d >= 0 ? '▲' : '▼') + ' ' + Math.abs(d) + '%</span> vs semana previa' : (sub || '')) + '</div></div>';
    html += '<div class="grid4" style="margin-bottom:14px">' +
      kpi('Alcance semanal', last.alcance != null ? (+last.alcance).toLocaleString() : '—', M.length ? 'total de la semana' : 'sin registros', delta(last.alcance, prev.alcance)) +
      kpi('Retención promedio', last.retencion != null ? last.retencion + '%' : '—', 'benchmark 40–45%', delta(last.retencion, prev.retencion)) +
      kpi('Interacción / alcance', last.alcance > 0 ? ((last.interaccion||0) / last.alcance * 100).toFixed(1) + '%' : '—', 'benchmark 5–8%', null) +
      kpi('Seguidores', last.seguidores != null ? (+last.seguidores).toLocaleString() : '—', 'vanidad controlada: se reporta, no se optimiza', delta(last.seguidores, prev.seguidores)) + '</div>' +
      '<div class="grid4" style="margin-bottom:18px">' +
      kpi('ICG promedio del banco', icgProm ? icgProm.toFixed(2) : '—', 'meta: ≥ 50% de piezas con ICG > 1') +
      kpi('ROAS', roas != null ? roas.toFixed(1) + '×' : '—', 'meta mes 6: ≥ 3 retail · ≥ 5 ticket alto') +
      kpi('CPA', cpa != null ? UI.fmtMoney(cpa) : '—', 'costo por conversión') +
      kpi('CPL', cpl != null ? UI.fmtMoney(cpl) : '—', 'costo por DM/lead iniciado') + '</div>';

    // Embudo del método
    if (last.alcance > 0){
      const f = [
        ['Alcance', +last.alcance || 0],
        ['Interacciones', +last.interaccion || 0],
        ['Visitas a perfil', +last.visitas || 0],
        ['DMs / leads', +last.dms || 0],
        ['Conversiones', +last.conversiones || 0]
      ];
      html += '<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Embudo de la semana</h3><span class="hint">Atención → Interés → Confianza → Acción</span></div><div class="card-b">' +
        f.map((x,i) => {
          const pct = f[0][1] ? Math.max(.5, x[1] / f[0][1] * 100) : 0;
          return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><span style="width:120px;font-size:12px;color:var(--muted)">' + x[0] + '</span>' +
            '<div style="flex:1;height:22px;background:#F0F2F6;border-radius:5px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + (i === f.length-1 ? 'var(--green)' : 'var(--blue)') + ';opacity:' + (1 - i*.12) + '"></div></div>' +
            '<b class="num" style="width:80px;text-align:right;font-family:var(--mono);font-size:12.5px">' + x[1].toLocaleString() + '</b></div>';
        }).join('') + '</div></div>';
    }

    // Gráficas
    if (M.length >= 2){
      const lbl = M.map(m => m.semana.slice(5));
      html += '<div class="grid2" style="margin-bottom:18px">' +
        '<div class="card"><div class="card-h"><h3>Alcance</h3></div><div class="card-b">' + UI.svgLine(M.map(m => m.alcance), lbl) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>Conversiones</h3></div><div class="card-b">' + UI.svgLine(M.map(m => m.conversiones), lbl, 520, 150, 'var(--green)') + '</div></div></div>';
    }

    // Alertas inteligentes (reglas 12.7 / 12.8 del método, evaluadas en código)
    const alertas = this.alertas(c, last, prev, icgProm);
    html += '<div class="grid2"><div class="card"><div class="card-h"><h3>Alertas inteligentes</h3><span class="hint">diagnóstico por síntoma (método §12.7–12.8)</span></div><div class="card-b">' +
      (alertas.length ? alertas.map(a => '<div class="alert-it"><div class="ic" style="background:var(--' + a.c + '-t);color:var(--' + a.c + ')">' + a.i + '</div><div><b>' + a.t + '</b><p>' + a.p + '</p></div></div>').join('')
        : '<div class="empty" style="padding:24px"><p>Sin alertas. Registra semanas y piezas para que el sistema vigile los síntomas del método.</p></div>') +
      '</div></div><div class="card"><div class="card-h"><h3>Análisis del estratega</h3></div><div class="card-b" id="anBox">' +
      (c.analisis ? '<div style="font-size:13px;white-space:pre-wrap">' + UI.esc(c.analisis) + '</div>' : '<p style="color:var(--faint);font-size:13px">Pide un análisis: la IA lee tus métricas y responde con el diagnóstico y la acción correctiva del método.</p>') +
      '</div></div></div>';

    if (M.length){
      html += '<div class="card" style="margin-top:18px"><div class="card-h"><h3>Histórico semanal</h3></div><div class="card-b" style="padding:0;overflow-x:auto"><table class="tb"><tr><th>Semana</th><th>Alcance</th><th>Ret. %</th><th>Interac.</th><th>Visitas</th><th>DMs</th><th>Conv.</th><th>Seguid.</th><th>Gasto</th><th>Ingresos</th><th></th></tr>' +
        M.slice().reverse().map(m => '<tr><td class="num">' + UI.esc(m.semana) + '</td><td class="num">' + (+m.alcance||0).toLocaleString() + '</td><td class="num">' + (m.retencion||0) + '</td><td class="num">' + (m.interaccion||0) + '</td><td class="num">' + (m.visitas||0) + '</td><td class="num">' + (m.dms||0) + '</td><td class="num">' + (m.conversiones||0) + '</td><td class="num">' + (m.seguidores||0) + '</td><td class="num">' + (m.gasto||0) + '</td><td class="num">' + (m.ingresos||0) + '</td>' +
          '<td><button class="btn sm ghost danger" data-delm="' + m.semana + '">✕</button></td></tr>').join('') + '</table></div></div>';
    }
    el.innerHTML = html;
    document.getElementById('bSem').onclick = () => this.formulario(c);
    const bAn = document.getElementById('bAn');
    if (bAn && !bAn.disabled) bAn.onclick = () => this.analizar(c);
    el.querySelectorAll('[data-delm]').forEach(b => b.onclick = () => {
      c.metricas = c.metricas.filter(x => x.semana !== b.dataset.delm); Store.save(); App.refresh();
    });
  },
  alertas(c, last, prev, icgProm){
    const A = [];
    if (prev.alcance > 0 && last.alcance > 0 && last.alcance < prev.alcance * 0.6)
      A.push({ i:'!', c:'red', t:'El alcance cayó más de 40%', p:'Si se repite una segunda semana: auditoría completa — originalidad, engagement bait, consistencia temática y cambios de algoritmo (§12.8).' });
    if (last.alcance > 0 && last.retencion > 0 && last.retencion < 35)
      A.push({ i:'▲', c:'amber', t:'Alto alcance, baja retención', p:'El gancho promete y el cuerpo no cumple: sube densidad, pattern interrupts cada 3–5 s y cumple la promesa del gancho.' });
    if (last.alcance > 0 && (last.interaccion||0) / last.alcance > 0.05 && (last.conversiones||0) === 0 && Store.etapaDe(c.mes) >= 2)
      A.push({ i:'→', c:'blue', t:'Engagement alto, cero ventas', p:'Falta el puente de conversión: CTA de palabra clave + DM automatizado + oferta clara (§12.7).' });
    if (prev.seguidores > 0 && last.seguidores > prev.seguidores && prev.alcance > 0 && last.alcance < prev.alcance)
      A.push({ i:'◇', c:'amber', t:'Seguidores suben, alcance baja', p:'El contenido gusta al círculo actual pero no descubre: aumenta formatos de descubrimiento (POV, ranking, tendencia adaptada).' });
    if (icgProm != null && icgProm < 0.9 && c.banco.length >= 6)
      A.push({ i:'ICG', c:'red', t:'ICG promedio bajo con muestra suficiente', p:'Si tras 6 semanas ninguna pieza supera 1.2, el problema no es el formato: reabrir pilares y propuesta de valor con el cliente (§12.8).' });
    if (last.gasto > 0 && last.dms > 0 && (last.conversiones||0) / last.dms < 0.1 && Store.etapaDe(c.mes) === 3)
      A.push({ i:'%', c:'amber', t:'Conversión DM→venta por debajo de 10%', p:'Con tráfico sano, el problema es la oferta o el cierre: revisa oferta (bonus stack), precio ancla y speed-to-lead <5 min.' });
    const pub = c.calendario.filter(k => k.publicado).length;
    if (pub > 0 && c.banco.length < pub)
      A.push({ i:'✎', c:'blue', t:(pub - c.banco.length) + ' pieza(s) publicadas sin registrar', p:'Sin registro no hubo prueba: captura sus métricas en el Banco a las 72 h y 7 días.' });
    return A;
  },
  formulario(c){
    const semDef = new Date().toISOString().slice(0,10);
    const num = (id,l) => '<div class="field"><label>' + l + '</label><input type="number" id="' + id + '" min="0" step="any" value="0"></div>';
    UI.modal('Registrar semana',
      '<div class="field"><label>Semana (fecha del viernes)</label><input type="date" id="mSem" value="' + semDef + '"></div><div class="fgrid">' +
      num('mAl','Alcance') + num('mRet','Retención prom. %') + num('mInt','Interacciones') +
      num('mVis','Visitas a perfil') + num('mDm','DMs / leads') + num('mConv','Conversiones') +
      num('mSeg','Seguidores totales') + num('mGas','Gasto en pauta (USD)') + num('mIng','Ingresos atribuidos (USD)') +
      '</div><button class="btn pri" id="mOk" style="width:100%">Guardar semana</button>',
      () => {
        document.getElementById('mOk').onclick = () => {
          const g = id => +document.getElementById(id).value || 0;
          c.metricas.push({ semana: document.getElementById('mSem').value,
            alcance:g('mAl'), retencion:g('mRet'), interaccion:g('mInt'), visitas:g('mVis'),
            dms:g('mDm'), conversiones:g('mConv'), seguidores:g('mSeg'), gasto:g('mGas'), ingresos:g('mIng') });
          c.metricas.sort((a,b) => a.semana < b.semana ? -1 : 1);
          Store.save(); UI.closeModal(); App.refresh(); UI.toast('Semana registrada');
        };
      });
  },
  async analizar(c){
    const box = document.getElementById('anBox');
    box.innerHTML = UI.thinking('Leyendo métricas con las tablas de diagnóstico del método…');
    try{
      const txt = await AI.raw(
        AI.system(['operativo','icg','principios'], 'Analizas el dashboard como estratega senior. Estructura tu respuesta en 3 bloques breves titulados DIAGNÓSTICO, ACCIÓN DE LA SEMANA y RIESGO, cada uno de 2-3 frases, aplicando el diagnóstico por síntoma y las reglas de intervención. Nada genérico: usa los números reales.', true),
        AI.clienteCtx(c) + '\nMétricas semanales: ' + JSON.stringify(c.metricas.slice(-6)) +
        '\nBanco (título, icg): ' + JSON.stringify(c.banco.map(b => [b.titulo, b.icg]).slice(-10)));
      c.analisis = txt.trim(); Store.save(); App.refresh();
    }catch(e){ box.innerHTML = '<div class="warn">Error: ' + UI.esc(e.message) + '</div>'; }
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO S10 — js/screens/metodo.js · Base de conocimiento,
   módulos de actualización (nuevas plataformas / algoritmos) y
   respaldo de datos. Aquí se actualiza el sistema sin tocar código.
   ════════════════════════════════════════════════════════════════ */
const S_Metodo = {
  title: 'Método y actualizaciones',
  render(el){
    let html = '<div class="h-page"><div><h2>Método 3·2·1 · v' + KB.version + '</h2><p>La base de conocimiento gobierna cada respuesta de la IA. Agrega módulos para nuevas plataformas (TikTok Shop, Threads, YouTube, Pinterest, LinkedIn), cambios de algoritmo o nuevas fórmulas — sin romper la aplicación.</p></div></div>';

    html += '<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Módulos de actualización</h3><span class="hint">se inyectan en todas las llamadas de IA; el más reciente manda</span></div><div class="card-b">';
    const mods = Store.data.modules || [];
    if (mods.length){
      html += '<table class="tb" style="margin-bottom:14px"><tr><th>Módulo</th><th>Fecha</th><th>Reglas</th><th></th></tr>' +
        mods.map(m => '<tr><td><b>' + UI.esc(m.nombre) + '</b></td><td class="num">' + UI.esc(m.fecha) + '</td><td style="font-size:12px;color:var(--muted)">' + UI.esc((m.reglas||'').slice(0,140)) + ((m.reglas||'').length > 140 ? '…' : '') + '</td>' +
          '<td style="white-space:nowrap"><button class="btn sm" data-tog="' + m.id + '">' + (m.activo === false ? 'Activar' : 'Pausar') + '</button> <button class="btn sm ghost danger" data-delmod="' + m.id + '">✕</button></td></tr>').join('') + '</table>';
    } else {
      html += '<p style="color:var(--faint);font-size:13px;margin-bottom:14px">Sin módulos. Ejemplo: "TikTok Shop — los videos con producto etiquetado entran a superficies de compra; CTA directo al carrito; comisión X%…"</p>';
    }
    html += '<div class="fgrid" style="grid-template-columns:1fr 2fr auto;align-items:end">' +
      '<div class="field"><label>Nombre del módulo</label><input id="modNom" placeholder="p. ej. TikTok Shop · Q3 2026"></div>' +
      '<div class="field"><label>Reglas nuevas</label><input id="modReg" placeholder="qué cambia, qué se prioriza, qué se prohíbe…"></div>' +
      '<div class="field"><button class="btn pri" id="bMod">Agregar módulo</button></div></div></div></div>';

    html += '<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Notas internas de la agencia</h3><span class="hint">criterios propios que la IA debe respetar siempre</span></div><div class="card-b">' +
      '<div class="field"><textarea id="kbNotas" style="min-height:90px" placeholder="p. ej. Nunca proponer sorteos; el tono de la agencia es directo y sin emojis…">' + UI.esc(Store.data.kbNotes || '') + '</textarea></div>' +
      '<button class="btn" id="bNotas">Guardar notas</button></div></div>';

    html += '<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Base de conocimiento activa</h3><span class="hint">extractos del documento oficial que usa la IA</span></div><div class="card-b">' +
      Object.keys(KB.sec).map(k => '<details class="acc"><summary style="font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em">' + k + '<span class="car">▶</span></summary><div class="acc-b"><div class="script">' + UI.esc(KB.sec[k]) + '</div></div></details>').join('') +
      '</div></div>';

    html += '<div class="card"><div class="card-h"><h3>Datos</h3></div><div class="card-b" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<button class="btn" id="bExp">Exportar respaldo (JSON)</button>' +
      '<label class="btn" style="position:relative;overflow:hidden">Importar respaldo<input type="file" id="bImp" accept=".json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>' +
      '<span class="login-hint">' + (Store.persistente ? 'Persistencia activa: tus datos se guardan automáticamente en este espacio.' : 'Este entorno no tiene almacenamiento persistente: exporta tu respaldo al terminar.') + '</span></div></div>';

    el.innerHTML = html;
    document.getElementById('bMod').onclick = () => {
      const n = document.getElementById('modNom').value.trim(), r = document.getElementById('modReg').value.trim();
      if (!n || !r){ UI.toast('Completa nombre y reglas'); return; }
      Store.data.modules.push({ id: Store.uid(), nombre:n, reglas:r, fecha: new Date().toISOString().slice(0,10), activo:true });
      Store.save(); App.refresh(); UI.toast('Módulo agregado a la base de conocimiento');
    };
    document.getElementById('bNotas').onclick = () => {
      Store.data.kbNotes = document.getElementById('kbNotas').value; Store.save(); UI.toast('Notas guardadas');
    };
    document.getElementById('bExp').onclick = () => Store.exportar();
    document.getElementById('bImp').onchange = e => { if (e.target.files[0]) Store.importar(e.target.files[0]); };
    el.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
      const m = Store.data.modules.find(x => x.id === b.dataset.tog);
      m.activo = m.activo === false ? true : false; Store.save(); App.refresh();
    });
    el.querySelectorAll('[data-delmod]').forEach(b => b.onclick = () => {
      Store.data.modules = Store.data.modules.filter(x => x.id !== b.dataset.delmod); Store.save(); App.refresh();
    });
  }
};

/* ════════════════════════════════════════════════════════════════
   MÓDULO ROUTER — js/app.js · Navegación, topbar y arranque
   ════════════════════════════════════════════════════════════════ */
const App = {
  rutas: [
    { id:'cli', icon:'M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-5.5 6a5.5 5.5 0 0 1 11 0z', s: () => S_Clientes, grupo:'Cliente' },
    { id:'dx',  icon:'M2 8h3l2-5 3 10 2-5h2', s: () => S_Dx },
    { id:'est', icon:'M2 13h3V6H2zm5 0h3V2H7zm5 0h3V9h-3z', s: () => S_Estrategia, grupo:'Sistema' },
    { id:'con', icon:'M3 2h10v9l-3 3H3zM10 14v-3h3', s: () => S_Contenido },
    { id:'cal', icon:'M3 3h10v10H3zM3 6h10M6 2v2M10 2v2', s: () => S_Cal },
    { id:'ban', icon:'M8 2l1.8 3.9L14 6.5l-3 3 .8 4.3L8 11.7l-3.8 2.1L5 9.5l-3-3 4.2-.6z', s: () => S_Banco, grupo:'Operación' },
    { id:'ads', icon:'M2 9l9-6v10zM11 6h3v2h-3M4 13l1 2', s: () => S_Ads },
    { id:'aut', icon:'M9 1L3 9h4l-1 6 6-8H8z', s: () => S_Autos },
    { id:'dash',icon:'M8 8V2a6 6 0 1 1-6 6h6z M10 1a5 5 0 0 1 5 5h-5z', s: () => S_Dash },
    { id:'kb',  icon:'M8 5a2.5 2.5 0 1 1 0 6a2.5 2.5 0 0 1 0-6zM8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5L13 13M13 3l-1.5 1.5M4.5 11.5L3 13', s: () => S_Metodo, grupo:'Sistema' }
  ],
  labels: { cli:'Nuevo cliente', dx:'Diagnóstico', est:'Estrategia 6 meses', con:'Contenido', cal:'Calendario', ban:'Banco de Ganadores', ads:'Publicidad', aut:'Automatizaciones', dash:'Dashboard', kb:'Método' },
  actual: 'cli',
  go(id){ this.actual = id; this.refresh(); },
  sinCliente(){
    return '<div class="card"><div class="empty"><div class="art">3·2·1</div><h4>Primero crea un cliente</h4><p>Toda pantalla trabaja sobre la ficha del cliente activo.</p><button class="btn pri" onclick="App.go(\'cli\')">Ir a Nuevo cliente</button></div></div>';
  },
  pintaNav(){
    const grupos = { Cliente:['cli','dx','est'], Operación:['con','cal','ban','ads','aut','dash'], Sistema:['kb'] };
    let h = '';
    Object.keys(grupos).forEach(g => {
      h += '<div class="nav-label">' + g + '</div>';
      grupos[g].forEach(id => {
        const r = this.rutas.find(x => x.id === id);
        h += '<button data-go="' + id + '" class="' + (this.actual === id ? 'on' : '') + '">' +
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + r.icon + '"/></svg>' +
          this.labels[id] + (this.actual === id ? '<span class="dot"></span>' : '') + '</button>';
      });
    });
    document.getElementById('nav').innerHTML = h;
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => this.go(b.dataset.go));
  },
  pintaRail(){
    const c = Store.client();
    const rail = document.getElementById('rail');
    if (!c){ rail.innerHTML = '<h4>Programa 3·2·1</h4><p style="font-size:11px;color:#5A6272">Sin cliente activo</p>'; return; }
    const et = Store.etapaDe(c.mes);
    const def = [ [1,'Reconocimiento',3,[1,2,3]], [2,'Consideración',2,[4,5]], [3,'Conversión',1,[6]] ];
    rail.innerHTML = '<h4>Programa 3·2·1</h4>' + def.map(d => {
      const meses = d[3];
      const done = meses.filter(m => m < c.mes).length + (meses.includes(c.mes) ? .5 : 0);
      const pct = Math.min(100, done / meses.length * 100);
      return '<div class="rail-row' + (et === d[0] ? ' live' : '') + '"><span class="num">' + d[2] + '</span><span class="tag">' + d[1] + '</span><div class="bar"><i style="width:' + (et > d[0] ? 100 : (et === d[0] ? pct : 0)) + '%"></i></div></div>';
    }).join('') + '<div class="rail-mes">Mes ' + c.mes + ' de 6 · Etapa ' + et + '</div>';
  },
  paintChrome(){
    const sel = document.getElementById('clientSel');
    sel.innerHTML = Store.data.clients.length
      ? Store.data.clients.map(c => '<option value="' + c.id + '"' + (c.id === Store.data.activeId ? ' selected' : '') + '>' + UI.esc(c.intake.empresa || 'Cliente sin nombre') + '</option>').join('')
      : '<option>— sin clientes —</option>';
    const c = Store.client();
    const ms = document.getElementById('mesStep');
    if (c){
      ms.style.display = 'flex';
      document.getElementById('mesLbl').textContent = 'Mes ' + c.mes + ' · Etapa ' + Store.etapaDe(c.mes);
    } else ms.style.display = 'none';
    this.pintaRail();
  },
  refresh(){
    this.pintaNav(); this.paintChrome();
    const r = this.rutas.find(x => x.id === this.actual);
    document.getElementById('crumb').textContent = r.s().title;
    r.s().render(document.getElementById('view'));
    document.querySelector('.view').scrollTop = 0;
  },
  async init(){
    await Store.load();
    document.getElementById('clientSel').onchange = e => {
      const c = Store.data.clients.find(x => x.id === e.target.value);
      if (c){ Store.data.activeId = c.id; Store.save(); this.refresh(); }
    };
    document.getElementById('mesDown').onclick = () => { const c = Store.client(); if (c && c.mes > 1){ c.mes--; Store.save(); this.refresh(); } };
    document.getElementById('mesUp').onclick = () => { const c = Store.client(); if (c && c.mes < 6){ c.mes++; Store.save(); this.refresh(); } };
    this.refresh();
  }
};
window.App = App;
App.init();
</script>
</body>
</html>
